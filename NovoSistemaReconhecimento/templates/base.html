<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
    <meta name="theme-color" content="#1f6b5c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <title>{% block title %}FaceID{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="app {% if request.endpoint in ['register', 'recognize'] %}page-camera{% endif %} page-{{ request.endpoint or 'index' }}">
    <header class="app-topbar">
        <div class="app-topbar-inner">
            <a href="{{ url_for('index') }}" class="logo">FaceID</a>
            <span class="app-topbar-title">{% block topbar_title %}Início{% endblock %}</span>
            <nav class="nav-desktop">
                <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}class="active"{% endif %}>Início</a>
                <a href="{{ url_for('register') }}" {% if request.endpoint == 'register' %}class="active"{% endif %}>Cadastrar</a>
                <a href="{{ url_for('recognize') }}" {% if request.endpoint == 'recognize' %}class="active"{% endif %}>Reconhecer</a>
            </nav>
        </div>
    </header>

    <main class="app-main container">
        {% block content %}{% endblock %}
    </main>

    <nav class="tabbar" aria-label="Navegação principal">
        <a href="{{ url_for('index') }}" class="tabbar-item {% if request.endpoint == 'index' %}active{% endif %}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z"/></svg>
            <span>Início</span>
        </a>
        <a href="{{ url_for('register') }}" class="tabbar-item {% if request.endpoint == 'register' %}active{% endif %}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5Zm7-7h-2V5h-2v2h-2v2h2v2h2V9h2V7Z"/></svg>
            <span>Cadastrar</span>
        </a>
        <a href="{{ url_for('recognize') }}" class="tabbar-item {% if request.endpoint == 'recognize' %}active{% endif %}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V4h3V2H2v5h2Zm14-3h3v3h2V2h-5v2ZM7 22H2v-5h2v3h3v2Zm15-5v5h-5v-2h3v-3h2ZM8 8h8v8H8V8Zm2 2v4h4v-4h-4Z"/></svg>
            <span>Reconhecer</span>
        </a>
    </nav>

    {% block scripts %}{% endblock %}
</body>
</html>
